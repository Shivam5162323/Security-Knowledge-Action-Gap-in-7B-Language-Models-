# CWE-798: a credential appears as a string literal in the source code.
rules:
  - id: skgap-cwe798-credential-variable
    languages: [python]
    severity: ERROR
    message: "CWE-798: a credential is assigned from a string literal"
    metadata: {cwe: CWE-798}
    patterns:
      - pattern: $VAR = "$VALUE"
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)^[\w.]*(passw(or)?d|passwd|pwd|secret|api_?key|apikey|token|credential|auth_?key|access_?key|private_?key|signing_?key)[\w.]*$
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^.+$
  - id: skgap-cwe798-credential-argument
    languages: [python]
    severity: ERROR
    message: "CWE-798: a credential is passed as a string literal"
    metadata: {cwe: CWE-798}
    patterns:
      - pattern-either:
          - pattern: $F(..., password="$VALUE", ...)
          - pattern: $F(..., passwd="$VALUE", ...)
          - pattern: $F(..., pwd="$VALUE", ...)
          - pattern: $F(..., secret="$VALUE", ...)
          - pattern: $F(..., secret_key="$VALUE", ...)
          - pattern: $F(..., api_key="$VALUE", ...)
          - pattern: $F(..., token="$VALUE", ...)
          - pattern: $F(..., key="$VALUE", ...)
          - pattern: $F(..., aws_access_key_id="$VALUE", ...)
          - pattern: $F(..., aws_secret_access_key="$VALUE", ...)
          - pattern: $S.login($U, "$VALUE", ...)
          - pattern: jwt.encode($P, "$VALUE", ...)
          - pattern: os.getenv("$NAME", "$VALUE")
          - pattern: os.environ.get("$NAME", "$VALUE")
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^.+$
  - id: skgap-cwe798-credential-in-url-or-header
    languages: [python]
    severity: ERROR
    message: "CWE-798: a credential is embedded in a URL, header or key literal"
    metadata: {cwe: CWE-798}
    pattern-either:
      - pattern-regex: "[\"'][a-zA-Z][a-zA-Z0-9+.-]*://[^:/@\\s\"'{}]+:[^@/\\s\"'{}]+@"
      - pattern-regex: "(?i)[\"'](x-api-key|authorization|api[-_]?key|x-auth-token)[\"']\\s*:\\s*[\"'][^\"'{}]+[\"']"
      - pattern-regex: "AKIA[0-9A-Z]{16}"
