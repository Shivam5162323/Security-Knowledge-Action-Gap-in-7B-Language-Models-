# CWE-89: data from a function parameter or the HTTP request reaches the text of
# an SQL statement. Bound parameters (the second argument of execute) are not a sink.
rules:
  - id: skgap-cwe89-sql-injection
    languages: [python]
    severity: ERROR
    message: "CWE-89: untrusted input is interpolated into the text of an SQL statement"
    metadata: {cwe: CWE-89}
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: |
              def $F(..., $P, ...):
                  ...
          - focus-metavariable: $P
      - pattern-either:
          - pattern: request.args
          - pattern: request.form
          - pattern: request.values
          - pattern: request.json
          - pattern: request.get_json(...)
    pattern-sanitizers:
      - pattern: int(...)
      - pattern: float(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $C.execute($Q, ...)
              - pattern: $C.executemany($Q, ...)
              - pattern: $C.executescript($Q)
              - pattern: $C.read_sql($Q, ...)
              - pattern: $C.read_sql_query($Q, ...)
              - pattern: text($Q)
          - focus-metavariable: $Q
